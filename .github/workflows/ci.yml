name: correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [research, dflash]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[${{ matrix.profile }},serve,test,transport]" build
      - if: matrix.profile == 'research'
        run: python -m pytest -q --basetemp .test-tmp-ci
      - if: matrix.profile == 'dflash'
        run: python -m pytest -q tests/test_runtime.py tests/test_runtime_migration.py tests/test_transport.py tests/test_transport_probe.py tests/test_transport_validation.py tests/test_transport_diagnosis.py tests/test_guided_reuse.py tests/test_guided_validation.py tests/test_guided_report.py tests/test_splice_reuse.py tests/test_splice_probe.py tests/test_splice_report.py tests/test_splice_cooldown_report.py tests/test_matrix.py tests/test_matrix_probe.py tests/test_matrix_report.py tests/test_benefit.py tests/test_benefit_report.py tests/test_acceptance.py tests/test_acceptance_probe.py tests/test_acceptance_report.py tests/test_prefix_risk.py tests/test_prefix_risk_probe.py tests/test_prefix_risk_report.py tests/test_serving.py tests/test_dflash_reuse.py --basetemp .test-tmp-ci
      - run: python -m build
      - if: matrix.profile == 'dflash'
        run: python -m pytest -q tests/test_asd.py tests/test_asd_budget.py tests/test_asd_budget_report.py tests/test_asd_completion.py tests/test_asd_completion_report.py tests/test_asd_probe.py tests/test_asd_report.py tests/test_asd_bench.py tests/test_asd_bench_report.py --basetemp .test-tmp-asd-ci
      - if: matrix.profile == 'dflash'
        run: python -m pytest -q tests/test_asd_attribution.py tests/test_asd_attribution_report.py --basetemp .test-tmp-asd-attribution-ci
      - if: matrix.profile == 'dflash'
        run: python -m pytest -q tests/test_prefix_risk_continuation.py tests/test_prefix_risk_continuation_report.py tests/test_prefix_risk_controls_report.py --basetemp .test-tmp-continuation-ci
      - run: python -m memorydraft benchmark --config configs/runtime-demo.json --requests examples/requests.jsonl --methods AR --repeats 1 --output artifacts/ci-demo
      - name: Installed wheel without inference dependencies
        run: |
          python -m venv artifacts/wheel-env
          artifacts/wheel-env/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/artifacts/wheel-env/bin/memorydraft" infer --config "$GITHUB_WORKSPACE/configs/runtime-demo.json" --request "$GITHUB_WORKSPACE/examples/request.json" --output "$GITHUB_WORKSPACE/artifacts/wheel-answer.json"
