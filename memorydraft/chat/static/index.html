<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f4">
  <title>MemoryDraft · 对话</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <section id="auth" class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark" aria-hidden="true">M<span>·</span></div>
      <p class="eyebrow">MEMORYDRAFT</p>
      <h1>从一个问题开始。</h1>
      <p class="muted">和自己的模型，聊一点有意思的事。</p>
      <div class="auth-tabs" role="group" aria-label="账号操作">
        <button id="login-tab" class="selected" type="button">登录</button>
        <button id="register-tab" type="button">注册</button>
      </div>
      <form id="auth-form">
        <label>用户名<input id="username" autocomplete="username" minlength="3" maxlength="32" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="至少 10 位"></label>
        <label id="invite-label" hidden>邀请码<input id="invite" autocomplete="off" maxlength="256"></label>
        <p id="auth-error" class="error" role="alert"></p>
        <button id="auth-submit" class="primary" type="submit">登录</button>
      </form>
      <p class="auth-foot">朋友专属空间 · 对话保存在你的账号下</p>
    </div>
  </section>
  <div id="workspace" class="workspace" hidden>
    <aside id="sidebar">
      <a class="brand" href="/">MemoryDraft<span class="brand-dot"></span></a>
      <button id="new-chat" class="new-chat" type="button"><span>＋</span> 新建对话</button>
      <p class="eyebrow history-heading">最近的对话</p>
      <nav id="history" aria-label="历史对话"></nav>
      <div class="account"><span id="account-name"></span><button id="logout" class="text-button" type="button">退出</button></div>
    </aside>
    <main>
      <header>
        <button id="menu" class="icon-button mobile-only" aria-label="切换会话列表" type="button">☰</button>
        <div><strong id="chat-title">新的对话</strong><p id="model-status" class="model-status">正在连接模型…</p></div>
        <button id="delete-chat" class="text-button" type="button" hidden>删除对话</button>
      </header>
      <div id="scroll-area" class="scroll-area">
        <section id="welcome" class="welcome">
          <div class="welcome-symbol" aria-hidden="true">✳</div>
          <p class="eyebrow">给想法留一点空间</p>
          <h1>今天想聊些什么？</h1>
          <p class="muted">写代码、理清一个问题，或者随便聊聊。</p>
          <div class="suggestions">
            <button type="button" data-prompt="帮我解释投机解码的工作原理，用一个简单例子说明。">理解一个概念 <span>↗</span></button>
            <button type="button" data-prompt="我想写一段代码，请先帮我理清需求。">一起写点代码 <span>↗</span></button>
          </div>
        </section>
        <section id="messages" class="messages" aria-label="对话消息"></section>
      </div>
      <div class="composer-area">
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="prompt">输入消息</label>
          <textarea id="prompt" rows="3" maxlength="16384" placeholder="输入你的问题，Shift + Enter 换行"></textarea>
          <div class="composer-bottom"><span>Qwen3-8B · 树 + ASD 加速</span><button id="send" class="send" type="submit" aria-label="发送消息">↑</button><button id="stop" class="stop" type="button" hidden>■ 停止</button></div>
        </form>
        <p class="footnote">回答可能出错，请核对重要信息。较长对话会保留最近能放入模型的上下文。</p>
      </div>
    </main>
  </div>
</body>
</html>
