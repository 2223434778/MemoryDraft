[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorydraft"
version = "0.1.0"
description = "User-memory conditioned speculative decoding research"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.7", "transformers==4.52.2", "numpy>=1.24,<2.5", "accelerate>=0.26"]

[project.optional-dependencies]
semantic = ["sentence-transformers==4.1.0"]
test = ["pytest>=8,<9"]

[project.scripts]
memorydraft = "memorydraft.cli:main"

[tool.setuptools.packages.find]
include = ["memorydraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
