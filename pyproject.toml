[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorydraft"
version = "0.3.0"
description = "Fixed-target inference, retrieval proposals, serving and correctness evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers==4.1.0"]
transport = ["POT==0.9.6.post1"]
test = ["pytest>=8,<9", "httpx==0.27.0", "rank-bm25==0.2.2"]
research = ["torch>=2.5,<2.7", "transformers==4.52.2", "numpy>=1.24,<2.5", "accelerate>=0.26", "pydivsufsort==0.0.19", "rank-bm25==0.2.2"]
dflash = ["torch>=2.5,<2.7", "transformers==4.57.3", "numpy>=1.24,<2.5", "accelerate>=0.26", "pydivsufsort==0.0.19"]
serve = ["fastapi==0.111.1", "uvicorn==0.30.2", "pydantic>=2.10,<3"]
client = ["httpx==0.27.0"]
training = ["peft==0.11.1"]

[project.scripts]
memorydraft = "memorydraft.cli:main"

[tool.setuptools.packages.find]
include = ["memorydraft*"]

[tool.setuptools.package-data]
memorydraft = ["assets/*.json", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
